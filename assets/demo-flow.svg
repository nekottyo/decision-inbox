<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 100" role="img" aria-labelledby="title desc">
<title id="title">修正の進め方</title><desc id="desc">必要な修正を確認し、公開した後に共通化を別途実施します。</desc>
<g fill="#18242e" stroke="#567080"><rect x="4" y="8" width="142" height="74" rx="5"/><rect x="191" y="8" width="138" height="74" rx="5"/><rect x="374" y="8" width="142" height="74" rx="5"/></g>
<g fill="none" stroke="#a9b8c4" stroke-width="2"><path d="M150 45h32m-7-5 7 5-7 5"/><path d="M333 45h32m-7-5 7 5-7 5"/></g>
<g fill="#e4edf1" text-anchor="middle" font-size="12" font-family="sans-serif"><text x="75" y="42">必要な修正を確認</text><text x="260" y="42">リリース</text><text x="445" y="42">共通化を別途実施</text></g>
<g fill="#a9b8c4" text-anchor="middle" font-size="10" font-family="sans-serif"><text x="75" y="62">今回の範囲を限定</text><text x="260" y="62">明日の予定を維持</text><text x="445" y="62">追跡用の依頼を残す</text></g>
