name: Claim verification

# branch protection で `gate` を必須チェックにするため、path filter は使わない。
# path filter 付きだと対象外の PR で workflow 自体が起動せず、必須チェックが「存在しない」
# 状態になってマージできなくなる。全 PR で起動し、対象ファイルの有無は `paths` job で判定する。
# main への push は、push のたびにその時点の main（tip commit）全体を対象に verify を実行するため、
# path filter を付けずに常時実行する（対象外ファイルだけの push でも走る）。
# この repo のマージは squash merge で 1 マージ = 1 commit = 1 push なので、main の各状態は検証済みになる。
# 複数の commit をまとめて push した場合、途中の commit は個別には検証されず、tip のみが対象になる。
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # 変更ファイルが verify の対象に当たるかを判定する（pull_request のみ）。
  # push では path filter を使わず、その push の tip に対して verify を常時実行するため、
  # この job は常に relevant=true を返す。
  # checkout は verify と同じバージョンに揃え、base ブランチとの差分を取れるよう全履歴を取得する。
  paths:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.check.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the changed paths
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          # push（main へのマージ）は path filter を付けず、その時点の main（tip）に対して
          # verify を実行するため、常に対象として扱う。
          if [ "$EVENT_NAME" = "push" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # pull_request では base ブランチを明示的に取得し、PR の差分だけを見る。
          # 取得に失敗した場合は判定不能なので fail closed にする（gate も失敗する）。
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          base="refs/remotes/origin/${BASE_REF}"

          # 差分の取得と判定を分ける。取得失敗と「対象パスなし」を同じ経路にすると
          # verify が skip されて gate が通ってしまう（fail open）ため、取得失敗は step を失敗させる。
          # core.quotepath=false により非 ASCII パスが引用されず、そのまま照合できる。
          if ! changed="$(git -c core.quotepath=false diff --name-only "${base}...HEAD")"; then
            echo "failed to compute the diff against ${base}" >&2
            exit 1
          fi

          # 判定は取り込んだ文字列に対して行う。pipeline の `grep -q` は最初の一致で終了し、
          # 上流の git diff が SIGPIPE で失敗して pipefail により全体が失敗する（変更ファイルが
          # 多い PR ほど一致していても relevant=false になる）ため使わない。
          # 単独ファイル名は行全体の完全一致、ディレクトリは prefix で判定する。
          if grep -Eq '^(app\.py|API\.md|scripts/update-release\.py|\.github/workflows/claim-verification\.yml)$|^(proofs/|tests/)' <<< "$changed"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: paths
    if: needs.paths.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # 旧 release の app.py と現行 DB の互換テストは Git 履歴を使う。
          fetch-depth: 0
          persist-credentials: false

      - name: Install Lean
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o elan.tar.gz https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz
          echo "42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  elan.tar.gz" | sha256sum -c -
          tar xzf elan.tar.gz
          ./elan-init -y --no-modify-path --default-toolchain leanprover/lean4:v4.36.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Check the models
        run: |
          lean proofs/ClaimLease.lean
          lean proofs/TaskAssignment.lean
          lean proofs/DecisionSnapshot.lean
          lean proofs/SessionRegistry.lean
          lean proofs/ReleaseSwitch.lean
          lean proofs/DeliveryAttempt.lean
          lean proofs/CheckRunner.lean

      - name: Test the implementation
        # PR では Release の build が同じ回帰テストを実行する。
        if: github.event_name == 'push'
        run: python3 -m unittest discover -s tests -p 'test_*.py'

  # branch protection で必須化する単一の集約チェック。
  # verify が対象外 PR で skipped になっても、paths と verify が失敗していなければ成功とする。
  # これにより「path filter の対象外だと必須チェックが存在しない」問題を解消する。
  gate:
    needs: [paths, verify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check the required jobs
        env:
          PATHS_RESULT: ${{ needs.paths.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          set -euo pipefail
          for result in "$PATHS_RESULT" "$VERIFY_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "required job did not succeed: $result" >&2
                exit 1
                ;;
            esac
          done
          echo "gate passed (paths=$PATHS_RESULT, verify=$VERIFY_RESULT)"
