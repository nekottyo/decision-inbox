<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>判断の受信箱</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#detail">案件の詳細へ</a>
  <header class="topbar">
    <h1 class="brand"><a href="./">判断の受信箱</a></h1>
    <span class="demo-label">ローカルデモ</span>
  </header>
  <main>
    <p class="demo-notice">デモ用の案件です。回答はこのブラウザーに保存され、依頼元には送信されません。</p>
    <div id="notice" class="notice" role="status" aria-live="polite" aria-atomic="true"></div>
    <p id="error" class="error" role="alert" hidden></p>
    <div class="workspace">
      <aside class="inbox" aria-label="案件一覧">
        <nav class="view-switch" aria-label="一覧の切り替え"><button type="button" data-view="pending" aria-pressed="true">判断待ち <span id="pending-count">3</span></button><button type="button" data-view="done" aria-pressed="false">判断済み <span id="done-count">1</span></button></nav>
        <div class="filter"><label for="priority">優先度</label><select id="priority"><option value="all">すべて</option><option value="urgent">すぐ判断</option><option value="normal">通常</option><option value="later">あとでよい</option></select></div>
        <div class="list-heading"><h2 id="list-title">判断待ち</h2><span>優先度順・受付順</span></div>
        <ul id="case-list" class="case-list"></ul>
        <p id="empty-list" class="empty-list" hidden>該当する案件はありません。</p>
      </aside>
      <article id="detail" class="detail" tabindex="-1" aria-label="選択した案件の詳細"></article>
    </div>
    <footer class="page-footer"><span>判断を記録した後は、「判断済み」で後続処理を確認できます。</span><button type="button" id="reset" class="text-button">デモの回答を初期化</button></footer>
  </main>
</body>
</html>
